services:
  plc:
    build: ./plc
    image: cithit/plc:latest
    container_name: ot-plc-ladder
    hostname: plc-compactlogix-sim
    environment:
      PLC_PROFILE: compactlogix_like
      MODBUS_PORT: "5020"
      PLC_CONFIG: /config/plc.yaml
      IO_PANEL_URL: http://remote-io:8080/api/io
      DHCP_ENABLED: "true"
    ports:
      - "5020:5020"
    volumes:
      - ./config:/config:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - ot_net

  remote-io:
    build: ./io-panel
    image: cithit/rio:latest
    container_name: ot-remote-io-panel
    hostname: remote-io-panel
    environment:
      IO_CONFIG: /config/io-panel.yaml
      DHCP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - ot_net

  hmi:
    build: ./hmi
    image: cithit/hmi:latest
    container_name: ot-hmi
    hostname: hmi-operator-panel
    environment:
      HMI_CONFIG: /config/hmi.yaml
      HMI_IP: dhcp
      PLC_HOST: plc
      PLC_PORT: "5020"
      PLC_UNIT_ID: "1"
      DHCP_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - ./config:/config
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - plc
    networks:
      - ot_net

networks:
  ot_net:
    driver: bridge
