services:
  plc:
    build: ./plc
    image: cithit/gns3-ics:plc-latest
    container_name: ot-plc-ladder
    hostname: plc-compactlogix-sim
    environment:
      PLC_PROFILE: compactlogix_like
      MODBUS_PORT: "5020"
      PLC_CONFIG: /config/plc.yaml
      IO_PANEL_URL: http://remote-io:8080/api/io
    ports:
      - "5020:5020"
    volumes:
      - ./config:/config:ro
    networks:
      ot_net:
        ipv4_address: 10.10.10.20

  remote-io:
    build: ./io-panel
    image: cithit/gns3-ics:remote-io-latest
    container_name: ot-remote-io-panel
    hostname: remote-io-panel
    environment:
      IO_CONFIG: /config/io-panel.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    networks:
      ot_net:
        ipv4_address: 10.10.10.30

  hmi:
    build: ./hmi
    image: cithit/gns3-ics:hmi-latest
    container_name: ot-hmi
    hostname: hmi-operator-panel
    environment:
      HMI_CONFIG: /config/hmi.yaml
      HMI_IP: 10.10.10.40
      PLC_HOST: 10.10.10.20
      PLC_PORT: "5020"
      PLC_UNIT_ID: "1"
    ports:
      - "8090:8090"
    volumes:
      - ./config:/config
    depends_on:
      - plc
    networks:
      ot_net:
        ipv4_address: 10.10.10.40

networks:
  ot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
